<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#0a0e1a;color:#eef1f8;font-family:"Poppins",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:#6f9bff}a:hover{color:#9dbcff}
    .phone{width:390px;min-height:844px;background:#0a0e1a;position:relative;overflow:hidden}
    .nav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    .logo{font-weight:700;font-size:20px;letter-spacing:-.02em}
    .burger{width:26px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
    .burger i{height:2px;background:#eef1f8;border-radius:2px}
    .gap{height:150px}
    .hero{padding:0 20px}
    .name{font-family:"Poppins";font-weight:700;font-size:46px;letter-spacing:-.03em;line-height:1;margin:0}
    .tag{color:#9aa3bd;font-size:20px;margin:14px 0 0}
    .search{display:flex;align-items:center;gap:12px;margin:44px 20px 0;padding-bottom:14px;border-bottom:1px solid rgba(154,163,189,.4)}
    .search .dot{width:22px;height:22px;border:1.5px solid #9aa3bd;border-radius:50%;position:relative;flex:0 0 auto}
    .search .dot::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#9aa3bd}
    .search span{color:#9aa3bd;font-size:20px}
    .deck{margin:28px 20px 0;height:300px;background:#1b1f2b;border-radius:16px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
    .platter{position:absolute;left:104px;top:34px;width:232px;height:232px;border-radius:50%;background:radial-gradient(circle,#20242f 0%,#171a22 70%);box-shadow:inset 0 0 0 10px rgba(255,255,255,.03),inset 0 0 40px rgba(0,0,0,.5)}
    .platter::before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#eef1f8;transform:translate(-50%,-50%)}
    .arm{position:absolute;right:26px;top:20px;width:4px;height:150px;background:#c8ccd6;border-radius:3px;transform:rotate(28deg);transform-origin:top}
    .arm::before{content:"";position:absolute;left:-7px;top:-8px;width:18px;height:18px;border-radius:50%;background:#dfe2e9}
    .fader{position:absolute;left:24px;top:34px;width:26px;height:200px;background:#12151d;border-radius:8px}
    .fader i{position:absolute;left:2px;right:2px;top:78px;height:22px;background:#6f9bff;border-radius:4px}
    .btns{position:absolute;left:26px;top:238px;display:flex;gap:6px}
    .btns i{width:12px;height:12px;background:#2b3040;border-radius:3px}
    .play{position:absolute;left:22px;top:256px;width:38px;height:38px;border-radius:50%;background:#2b3040}
    .play::after{content:"";position:absolute;left:15px;top:12px;border-left:9px solid #6b7488;border-top:6px solid transparent;border-bottom:6px solid transparent}
    .callout{position:absolute;left:20px;right:20px;bottom:20px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.06em;color:#6b7488;text-align:center;border-top:1px dashed rgba(154,163,189,.25);padding-top:10px}
  </style>
</helmet>
<div class="phone">
  <div class="nav"><div class="logo">D.</div><div class="burger"><i></i><i></i><i></i></div></div>
  <div class="gap"></div>
  <div class="hero">
    <h1 class="name">Diego Damian</h1>
    <p class="tag">welcome to my playground</p>
  </div>
  <div class="search"><span class="dot"></span><span>put a record on&hellip;</span></div>
  <div class="deck">
    <div class="fader"><i></i></div>
    <div class="btns"><i></i><i></i></div>
    <div class="play"></div>
    <div class="platter"></div>
    <div class="arm"></div>
  </div>
  <div class="callout">&darr; everything above &middot; ~420px of empty section below</div>
</div>
</x-dc>
</body>
</html>
