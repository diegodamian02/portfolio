<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#0a0e1a;color:#eef1f8;font-family:"Poppins",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
    .phone{width:390px;min-height:844px;background:#0a0e1a;position:relative;overflow:hidden;padding-top:120px}
    .title{font-family:"Poppins";font-weight:700;font-size:40px;letter-spacing:-.03em;text-align:center;margin:0}
    .year{width:98px;margin:48px auto 0;text-align:center;padding:9px 0;border:1.5px solid #6f9bff;border-radius:999px;font-weight:600;font-size:19px}
    .card{margin:22px 20px 0;height:512px;border-radius:16px;background:linear-gradient(180deg,#7a6f6a 0%,#4a4038 45%,#20242c 100%);position:relative;overflow:hidden}
    .card .cap{position:absolute;left:20px;bottom:18px;font-weight:700;font-size:22px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
    .raildot{position:absolute;left:-4px;top:454px;width:10px;height:10px;border-radius:50%;background:#6f9bff}
    .callout{position:absolute;left:20px;right:20px;bottom:20px;font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.05em;color:#6b7488;text-align:center;border-top:1px dashed rgba(154,163,189,.25);padding-top:10px;line-height:1.6}
  </style>
</helmet>
<div class="phone">
  <h1 class="title">Experience</h1>
  <div class="year">2019</div>
  <div class="card"><span class="cap">Colegio Peruano Brit&aacute;nico</span></div>
  <div class="raildot"></div>
  <div class="callout">1 of 6, swipe sideways &mdash; but no dots, no peek, no hint it moves.<br>~230px empty below.</div>
</div>
</x-dc>
</body>
</html>
