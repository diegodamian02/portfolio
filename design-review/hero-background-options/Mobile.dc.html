<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&family=Space+Mono&display=swap">
  <style>
    body { margin: 0; background: #0a0e1a; }
    a { color: #6f9bff; } a:hover { color: #8fb2ff; }

    .stage {
      position: relative; width: 390px; height: 844px; overflow: hidden;
      background: #0a0e1a;
      color: #eef1f8; font-family: "Urbanist", system-ui, sans-serif;
    }

    .reveal {
      position: absolute; inset: 0; z-index: 0;
      animation: m-enter .7s cubic-bezier(.2, .72, .2, 1) both;
    }
    @keyframes m-enter {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .m-bloom {
      position: absolute; left: 0; right: 0; bottom: 0; height: 44%; z-index: 0;
      pointer-events: none;
      background: radial-gradient(150% 110% at 50% 100%,
        color-mix(in srgb, var(--bloom) 24%, transparent), rgba(0,0,0,0) 70%);
      animation: m-breathe 10s ease-in-out infinite;
    }
    @keyframes m-breathe { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    .matrix {
      position: absolute; left: 0; right: 0; bottom: 0; height: 56%; z-index: 1;
      --cell: 15px;
      -webkit-mask: radial-gradient(circle at center, #000 30%, rgba(0,0,0,0) 38%) left bottom / var(--cell) var(--cell);
              mask: radial-gradient(circle at center, #000 30%, rgba(0,0,0,0) 38%) left bottom / var(--cell) var(--cell);
      animation: m-drift var(--drift-dur, 42s) ease-in-out infinite alternate;
    }
    @keyframes m-drift {
      from { filter: hue-rotate(calc(var(--drift-max, 20deg) * -1)); }
      to   { filter: hue-rotate(var(--drift-max, 20deg)); }
    }
    .m-glowspot {
      position: absolute; width: 360px; height: 360px; border-radius: 50%;
      left: -8%; bottom: -14%; mix-blend-mode: screen;
      background: radial-gradient(circle,
        color-mix(in srgb, var(--bloom) 48%, #ffffff), rgba(255,255,255,0) 60%);
      animation: m-spot 22s ease-in-out infinite;
    }
    @keyframes m-spot {
      0%, 100% { transform: translate(-6%, 0) scale(1); }
      50%      { transform: translate(75%, -16%) scale(1.2); }
    }
    .m-cols {
      position: absolute; inset: 0; display: grid;
      grid-template-columns: repeat(24, minmax(0, 1fr));
    }
    .m-col { position: relative; }
    .m-fill {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      transform-origin: bottom; transform: scaleY(.05); opacity: .9;
      background: linear-gradient(to top,
        color-mix(in srgb, var(--ch) 78%, #05070d),
        var(--ch) 52%,
        color-mix(in srgb, var(--ch) 55%, #ffffff));
      box-shadow: 0 0 12px color-mix(in srgb, var(--ch) 62%, transparent);
      animation-name: m-rise;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }
    @keyframes m-rise {
      0%, 100% { transform: scaleY(calc(var(--peak) * .24)); opacity: .55; }
      50%      { transform: scaleY(var(--peak));             opacity: 1; }
    }

    /* --- mobile hero chrome (stacked, centred) ------------------- */
    .chrome { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 84px 28px 40px; }
    .safe {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(330px 300px at 50% 40%, rgba(10,14,26,.8), rgba(10,14,26,0) 74%);
    }
    .deck-art { width: 168px; height: 168px; display: block; }
    .deck-grooves { animation: deck-spin 9s linear infinite; transform-origin: 230px 230px; }
    @keyframes deck-spin { to { transform: rotate(360deg); } }
    .np { font-family: "Space Mono", monospace; font-size: 10px; letter-spacing: .16em;
      color: #b7bed0; text-transform: uppercase; margin: 16px 0 0;
      display: flex; align-items: center; gap: 7px; }
    .np-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bloom, #eef1f8);
      box-shadow: 0 0 8px var(--bloom, #eef1f8); }
    .m-name { font-size: 42px; font-weight: 600; line-height: 1.05;
      margin: 52px 0 0; letter-spacing: -.012em; }
    .m-tag { font-size: 16px; font-weight: 400; color: #9aa3bd; margin: 12px 0 0; }
    .crate { display: flex; align-items: center; gap: 9px; margin-top: 30px;
      width: 260px; border-bottom: 1px solid rgba(238,241,248,.28);
      padding-bottom: 8px; color: #b7bed0; font-size: 15px; }
    .crate-ic { width: 15px; height: 15px; flex: none; }
    .tag-lo { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 3;
      text-align: center; font-family: "Space Mono", monospace; font-size: 10px;
      letter-spacing: .12em; color: #6f7893; text-transform: uppercase; }
  </style>
</helmet>

<div class="stage" style="--bloom: {{cfg.bloom}}">
  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div class="reveal">
      <div class="m-bloom"></div>
      <div class="matrix" style="--drift-max: {{cfg.driftMax}}; --drift-dur: {{cfg.driftDur}}">
        <div class="m-glowspot"></div>
        <div class="m-cols">
          <sc-for list="{{cols}}" as="col" hint-placeholder-count="24">
            <div class="m-col"><span class="m-fill" style="--ch: {{col.hue}}; --peak: {{col.peak}}; animation-delay: {{col.d}}s; animation-duration: {{col.dur}}s"></span></div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <div class="safe"></div>

  <div class="chrome">
    <svg class="deck-art" viewBox="0 0 460 460" aria-hidden="true">
      <rect x="10" y="10" width="440" height="440" rx="28" fill="#12161f" stroke="#232a3a"></rect>
      <circle cx="230" cy="230" r="182" fill="#0b0e16"></circle>
      <circle cx="230" cy="230" r="182" fill="none" stroke="#1d2432" stroke-width="1"></circle>
      <g class="deck-grooves" stroke="#1b2130" fill="none">
        <circle cx="230" cy="230" r="156"></circle>
        <circle cx="230" cy="230" r="134"></circle>
        <circle cx="230" cy="230" r="112"></circle>
        <circle cx="230" cy="230" r="90"></circle>
        <circle cx="230" cy="230" r="68"></circle>
      </g>
      <circle cx="230" cy="230" r="52" style="fill: var(--bloom)" opacity="0.92"></circle>
      <circle cx="230" cy="230" r="52" fill="none" stroke="#0a0e1a" stroke-width="2"></circle>
      <circle cx="230" cy="230" r="6" fill="#0a0e1a"></circle>
      <line x1="410" y1="66" x2="252" y2="248" stroke="#8b93a7" stroke-width="6" stroke-linecap="round"></line>
      <circle cx="410" cy="66" r="12" fill="#2a3040" stroke="#6f7789" stroke-width="2"></circle>
      <rect x="236" y="236" width="30" height="12" rx="3" fill="#9aa3bd" transform="rotate(37 251 242)"></rect>
    </svg>
    <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
      <p class="np"><span class="np-dot"></span>Now playing &mdash; sample track</p>
    </sc-if>
    <h1 class="m-name">Diego Damian</h1>
    <p class="m-tag">welcome to my playground</p>
    <div class="crate">
      <svg class="crate-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="20.5" y1="20.5" x2="16.5" y2="16.5"></line>
      </svg>
      <span>put a record on&hellip;</span>
    </div>
  </div>

  <div class="tag-lo">One scheme per song &mdash; {{cfg.label}}</div>
</div>
</x-dc>
<script data-dc-script data-props='{"scheme":{"editor":"enum","default":"Fern","options":["Cobalt","Amethyst","Ember","Rose","Citrine","Fern"],"section":"Scheme (per song)"},"state":{"editor":"enum","default":"Playing","options":["Playing","Idle"],"section":"Deck"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const SCHEMES = {
      Cobalt:   { label: "cobalt", tones: ["#1AACEA","#2C90FF","#3E82FF","#4C7DFF","#5F6DFF","#7A59FF"] },
      Amethyst: { label: "amethyst", tones: ["#7E5BFF","#9B4DFF","#AE48F5","#C247E4","#D74DD0","#EA4DBE"] },
      Ember:    { label: "ember", tones: ["#FF7A33","#FF5A3E","#FF4351","#FF3567","#F5386F","#E83C86"] },
      Rose:     { label: "rose", tones: ["#FF8A5C","#FF6B8E","#FF4DA6","#FF3BB0","#EA4DC8","#D95CD0"] },
      Citrine:  { label: "citrine", tones: ["#FFB81E","#FFCE2E","#FFE23D","#EEEF3A","#D6F736","#BFF82E"] },
      Fern:     { label: "fern", tones: ["#17DDB4","#22F0B0","#3AF29E","#5AF58C","#78F07A","#93EA66"] },
    };
    const scheme = SCHEMES[this.props.scheme] ?? SCHEMES.Cobalt;
    const list = scheme.tones;
    const playing = (this.props.state ?? "Playing") === "Playing";

    const parse = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const lerp = (a, b, t) => {
      const ca = parse(a), cb = parse(b);
      return "#" + ca.map((v, k) => Math.round(v + (cb[k] - v) * t).toString(16).padStart(2, "0")).join("");
    };
    const toneAt = (u) => {
      const f = u * (list.length - 1);
      const lo = Math.floor(f), hi = Math.min(list.length - 1, lo + 1);
      return lerp(list[lo], list[hi], f - lo);
    };

    const N = 24;
    const cols = Array.from({ length: N }, (_, i) => {
      const t = i / (N - 1);
      const env = 0.22 + 0.58 * Math.pow(1 - t, 0.5) + 0.18 * Math.abs(Math.sin(t * 6.5 + 0.4));
      return {
        hue: toneAt(t),
        peak: Math.max(0.14, Math.min(0.98, env)).toFixed(3),
        d: (-(i * 0.14 % 3.6)).toFixed(2),
        dur: (2.9 + (i % 5) * 0.3).toFixed(2),
      };
    });

    return {
      playing,
      cols,
      cfg: { driftMax: "20deg", driftDur: "42s", bloom: toneAt(0.5), label: scheme.label },
    };
  }
}
</script>
</body>
</html>
