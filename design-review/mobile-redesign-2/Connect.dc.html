<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#0a0e1a;color:#eef1f8;font-family:"Poppins",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:#6f9bff;text-decoration:none}
    a:hover{color:#9db8ff}
    .phone{width:390px;min-height:844px;background:#0a0e1a;position:relative;overflow:hidden;padding:0 20px 24px;display:flex;flex-direction:column}

    .nav{height:56px;display:flex;align-items:center;justify-content:space-between;margin:0 -20px}
    .mark{width:26px;height:26px;border-radius:50%;border:2px solid #eef1f8;position:relative}
    .mark::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#eef1f8;transform:translate(-50%,-50%)}
    .burger{width:26px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
    .burger i{height:2px;background:#eef1f8;border-radius:2px}

    .kicker{font-family:"Space Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9aa3bd;margin:18px 0 0}
    .title{font-family:"Poppins";font-weight:600;font-size:29px;letter-spacing:-.02em;margin:8px 0 0}
    .desc{color:#9aa3bd;font-size:13.5px;margin:8px 0 0;max-width:290px}

    .card{margin:20px 0 0;background:#12151d;border:1px solid rgba(154,163,189,.14);border-radius:12px;padding:16px 16px 16px 22px;position:relative;overflow:hidden}
    .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,#2b3040 0 7px,#20242f 7px 14px)}
    .reels{display:flex;gap:10px;margin-bottom:12px}
    .reels i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(154,163,189,.4)}
    .field{height:44px;border-radius:8px;background:#0d1017;border:1px solid rgba(154,163,189,.18);display:flex;align-items:center;padding:0 13px;color:#c3cbe0;font-size:14px;margin-top:10px}
    .field.muted{color:#6b7590}
    .area{height:92px;border-radius:8px;background:#0d1017;border:1px solid rgba(154,163,189,.18);padding:11px 13px;color:#6b7590;font-size:14px;margin-top:10px}
    .send{margin-top:12px;height:48px;border-radius:8px;background:#6f9bff;color:#0a0e1a;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px}
    .send svg{width:17px;height:17px}

    .spacer{flex:1;min-height:24px}
    .foot{display:flex;align-items:center;justify-content:space-between;padding-top:18px;border-top:1px solid rgba(154,163,189,.14)}
    .foot .who{font-family:"Poppins";font-weight:600;font-size:14px}
    .foot .soc{display:flex;gap:16px}
    .foot .soc a{width:26px;height:26px;color:#9aa3bd;display:inline-flex}
    .foot .soc svg{width:26px;height:26px}
  </style>
</helmet>
<div class="phone">
  <div class="nav">
    <div class="mark"></div>
    <div class="burger"><i></i><i></i><i></i></div>
  </div>

  <p class="kicker">Contact</p>
  <h1 class="title">Let&rsquo;s Connect!</h1>
  <p class="desc">Thanks for stopping by and playing a few tunes. Leave a note if you&rsquo;d like.</p>

  <div class="card">
    <div class="reels"><i></i><i></i></div>
    <div class="field muted">Your name</div>
    <div class="field muted">Email <span style="opacity:.6">&nbsp;(optional)</span></div>
    <div class="area">Write a message&hellip;</div>
    <div class="send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2"></rect><circle cx="8.5" cy="12" r="1.6"></circle><circle cx="15.5" cy="12" r="1.6"></circle></svg>
      Send
    </div>
  </div>

  <div class="spacer"></div>

  <div class="foot">
    <span class="who">Diego Damian</span>
    <span class="soc">
      <a aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 1 0 3.5a2.5 2.5 0 0 1 4.98 0ZM.5 8h4V24h-4V8Zm7 0h3.8v2.2h.06c.53-1 1.83-2.2 3.76-2.2 4.02 0 4.76 2.65 4.76 6.1V24h-4v-6.9c0-1.65-.03-3.77-2.3-3.77-2.3 0-2.65 1.8-2.65 3.65V24h-4V8Z"></path></svg></a>
      <a aria-label="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.5v-1.94c-2.92.63-3.54-1.24-3.54-1.24-.48-1.22-1.17-1.54-1.17-1.54-.95-.65.08-.64.08-.64 1.06.08 1.62 1.09 1.62 1.09.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.67-1.4-2.33-.27-4.78-1.17-4.78-5.19 0-1.15.4-2.08 1.09-2.82-.11-.27-.47-1.34.1-2.78 0 0 .88-.28 2.9 1.07a10 10 0 0 1 5.28 0c2-1.35 2.89-1.07 2.89-1.07.57 1.44.21 2.51.1 2.78.68.74 1.09 1.67 1.09 2.82 0 4.03-2.46 4.92-4.8 5.18.38.33.71.97.71 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5Z"></path></svg></a>
      <a aria-label="Spotify"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.6 14.4a.75.75 0 0 1-1 .25c-2.8-1.7-6.3-2.1-10.4-1.1a.75.75 0 1 1-.35-1.45c4.5-1.1 8.4-.65 11.5 1.25.36.22.47.7.25 1.05Zm1.2-2.9a.94.94 0 0 1-1.3.3c-3.2-2-8-2.55-11.8-1.4a.94.94 0 1 1-.55-1.8c4.3-1.3 9.7-.7 13.35 1.55.44.27.58.85.3 1.35Zm.1-3c-3.85-2.28-10.2-2.5-13.87-1.38a1.12 1.12 0 1 1-.65-2.15c4.2-1.28 11.2-1.03 15.65 1.6a1.13 1.13 0 0 1-1.13 1.94Z"></path></svg></a>
    </span>
  </div>
</div>
</x-dc>
</body>
</html>
