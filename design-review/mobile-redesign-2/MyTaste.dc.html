<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&family=Space+Mono:wght@400;700&family=Poppins:wght@400;600&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#0a0e1a;color:#eef1f8;font-family:"Poppins",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
    a{color:#6f9bff;text-decoration:none}
    a:hover{color:#9db8ff}
    .phone{width:390px;min-height:844px;background:#0a0e1a;position:relative;overflow:hidden;padding:0 0 24px}

    .nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    .mark{width:26px;height:26px;border-radius:50%;border:2px solid #eef1f8;position:relative}
    .mark::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#eef1f8;transform:translate(-50%,-50%)}
    .burger{width:26px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
    .burger i{height:2px;background:#eef1f8;border-radius:2px}

    .kick{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#9aa3bd;padding:12px 20px 0;display:flex;align-items:center;gap:10px}
    .kick svg{width:13px;height:13px;color:#1DB954}
    .zone{font-family:"Space Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9aa3bd;padding:0 20px;margin-top:22px}

    .row{display:flex;gap:18px;padding:16px 20px 0;overflow:hidden}
    .tcard{flex:0 0 150px;position:relative;padding:9px 9px 12px;box-shadow:0 16px 30px rgba(0,0,0,.42);clip-path:polygon(0% 2%,4% 0%,38% 1.5%,62% 0%,96% 1%,100% 3%,99% 34%,100% 66%,99% 97%,95% 100%,60% 98.5%,32% 100%,6% 99%,0% 97%,1% 60%,0% 30%)}
    .tcard:nth-child(1){transform:rotate(-2.5deg);background:#3a1720}
    .tcard:nth-child(2){transform:rotate(1.5deg);background:#173049}
    .tcard:nth-child(3){transform:rotate(-1deg);background:#1c2a1f}
    .tcard::before{content:"";position:absolute;left:50%;top:-9px;width:74px;height:19px;background:rgba(232,236,244,.42);box-shadow:0 1px 4px rgba(0,0,0,.3);transform:translateX(-50%) rotate(-4deg)}
    .tcard .img{height:150px;background:linear-gradient(150deg,#4a5266,#262b38)}
    .tcard .nm{font-family:"Anton","Arial Narrow",sans-serif;font-size:19px;margin-top:9px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2ded2}

    .dots{display:flex;gap:7px;padding:14px 20px 0}
    .dots i{width:6px;height:6px;border-radius:50%;background:rgba(154,163,189,.3)}
    .dots i.on{background:#6f9bff;width:18px;border-radius:3px}

    .crate{margin:16px 20px 0;background:#141a27;border:1px solid rgba(154,163,189,.12);border-radius:4px;padding:16px 14px 8px;position:relative}
    .crate::before{content:"";position:absolute;left:24px;top:-10px;width:96px;height:20px;background:rgba(232,236,244,.4);transform:rotate(-2deg);box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .trk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(154,163,189,.1)}
    .trk:last-child{border-bottom:0}
    .trk .th{width:38px;height:38px;flex:0 0 auto;border-radius:3px;background:linear-gradient(150deg,#3a4358,#242a3a)}
    .trk .n{font-family:"Space Mono",monospace;font-weight:700;font-size:14px;width:20px;text-align:center;flex:0 0 auto}
    .trk .m{min-width:0;flex:1}
    .trk .t{font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.02em}
    .trk .ar{font-family:"Space Mono",monospace;font-size:10.5px;color:#9aa3bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .c1{color:#e08aa0}.c2{color:#e0a35a}.c3{color:#7fa0e6}.c4{color:#6fbf9c}.c5{color:#b48ad0}
  </style>
</helmet>
<div class="phone">
  <div class="nav">
    <div class="mark"></div>
    <div class="burger"><i></i><i></i><i></i></div>
  </div>

  <div class="kick">
    my taste
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.6 14.4a.75.75 0 0 1-1 .25c-2.8-1.7-6.3-2.1-10.4-1.1a.75.75 0 1 1-.35-1.45c4.5-1.1 8.4-.65 11.5 1.25.36.22.47.7.25 1.05Zm1.2-2.9a.94.94 0 0 1-1.3.3c-3.2-2-8-2.55-11.8-1.4a.94.94 0 1 1-.55-1.8c4.3-1.3 9.7-.7 13.35 1.55.44.27.58.85.3 1.35Z"></path></svg>
    <span style="margin-left:auto;color:#6f9bff;font-weight:700">Spotify &#8599;</span>
  </div>

  <div class="zone">My top artists</div>
  <div class="row">
    <div class="tcard"><div class="img"></div><div class="nm">Oasis</div></div>
    <div class="tcard"><div class="img"></div><div class="nm">Red Hot Ch&hellip;</div></div>
    <div class="tcard"><div class="img"></div><div class="nm">The Strokes</div></div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i></div>

  <div class="zone">My top 5 tracks</div>
  <div class="crate">
    <div class="trk"><span class="th"></span><span class="n c1">1</span><span class="m"><span class="t">Just Like Heaven</span><span class="ar">The Cure</span></span></div>
    <div class="trk"><span class="th"></span><span class="n c2">2</span><span class="m"><span class="t">Alive</span><span class="ar">Pearl Jam</span></span></div>
    <div class="trk"><span class="th"></span><span class="n c3">3</span><span class="m"><span class="t">Semi-Charmed Life</span><span class="ar">Third Eye Blind</span></span></div>
    <div class="trk"><span class="th"></span><span class="n c4">4</span><span class="m"><span class="t">Wonderwall</span><span class="ar">Oasis</span></span></div>
    <div class="trk"><span class="th"></span><span class="n c5">5</span><span class="m"><span class="t">Last Nite</span><span class="ar">The Strokes</span></span></div>
  </div>
</div>
</x-dc>
</body>
</html>
