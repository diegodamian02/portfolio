<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:#0a0e1a;color:#eef1f8;font-family:"Poppins",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:#6f9bff;text-decoration:none}
    a:hover{color:#9db8ff}
    .phone{width:390px;min-height:844px;background:#0a0e1a;position:relative;overflow:hidden}

    /* dot-matrix atmosphere */
    .matrix{position:absolute;left:0;right:0;bottom:0;height:62%;background-image:radial-gradient(circle,rgba(111,155,255,.42) 1px,transparent 1.6px);background-size:15px 15px;-webkit-mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.35) 45%,transparent 100%);mask-image:linear-gradient(to top,#000 5%,rgba(0,0,0,.35) 45%,transparent 100%);pointer-events:none}
    .glow{position:absolute;left:50%;bottom:-120px;width:460px;height:320px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(111,155,255,.20),transparent 70%);pointer-events:none}

    .wrap{position:relative;z-index:2}
    .nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
    .mark{width:26px;height:26px;border-radius:50%;border:2px solid #eef1f8;position:relative}
    .mark::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#eef1f8;transform:translate(-50%,-50%)}
    .burger{width:26px;height:12px;display:flex;flex-direction:column;justify-content:space-between}
    .burger i{height:2px;background:#eef1f8;border-radius:2px}

    .head{padding:6px 20px 0}
    .letter{font-family:"Space Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9aa3bd;margin:0}
    .hl{font-family:"Poppins";font-weight:600;font-size:36px;letter-spacing:-.03em;line-height:1.04;margin:14px 0 0}
    .sub{color:#9aa3bd;font-size:14px;margin:10px 0 0;max-width:270px}

    .search{margin:22px 20px 0;height:56px;border-radius:15px;background:#12151d;border:1.5px solid rgba(111,155,255,.55);box-shadow:0 0 0 4px rgba(111,155,255,.10),0 14px 34px rgba(111,155,255,.14);display:flex;align-items:center;gap:13px;padding:0 18px}
    .search .rec{width:22px;height:22px;border:1.6px solid #9db8ff;border-radius:50%;position:relative;flex:0 0 auto}
    .search .rec::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#9db8ff}
    .search .ph{color:#c3cbe0;font-size:16px}
    .search .go{margin-left:auto;color:#6f9bff}

    .deck{margin:24px 14px 0;height:346px;background:linear-gradient(180deg,#191e2b,#12151d);border-radius:20px;position:relative;overflow:hidden;opacity:.72;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 60px rgba(0,0,0,.45)}
    .platter{position:absolute;left:104px;top:44px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#252a37,#14171f 72%);box-shadow:inset 0 0 0 10px rgba(255,255,255,.025),inset 0 0 40px rgba(0,0,0,.55)}
    .platter::before{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;border:1px dashed rgba(154,163,189,.35);border-radius:50%;transform:translate(-50%,-50%)}
    .platter::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#c9cede;transform:translate(-50%,-50%)}
    .arm{position:absolute;right:26px;top:24px;width:5px;height:150px;background:linear-gradient(#d3d7e0,#9aa0ad);border-radius:3px;transform:rotate(34deg);transform-origin:top right}
    .arm::before{content:"";position:absolute;left:-8px;top:-10px;width:21px;height:21px;border-radius:50%;background:#e2e5ec}
    .fader{position:absolute;left:22px;top:52px;width:34px;height:212px;background:#0d1017;border-radius:9px;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
    .fader i{position:absolute;left:4px;right:4px;top:88px;height:34px;background:linear-gradient(#c9cede,#8b91a1);border-radius:6px}
    .play{position:absolute;left:18px;bottom:20px;width:50px;height:50px;border-radius:50%;background:#2a2f3f;box-shadow:0 6px 16px rgba(0,0,0,.4)}
    .play::after{content:"";position:absolute;left:20px;top:15px;border-left:13px solid #aeb4c4;border-top:10px solid transparent;border-bottom:10px solid transparent}
    .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7f8ba6}

    .cue{display:flex;flex-direction:column;align-items:center;gap:4px;margin:20px 0 26px;font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5f6b86}
    .cue svg{width:14px;height:14px}
  </style>
</helmet>
<div class="phone">
  <div class="matrix"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="nav">
      <div class="mark"></div>
      <div class="burger"><i></i><i></i><i></i></div>
    </div>
    <div class="head">
      <p class="letter">Diego Damian &mdash; Software Engineer</p>
      <h1 class="hl">Put a record on.</h1>
      <p class="sub">Search any track &mdash; a 30-second preview spins up on the platter.</p>
    </div>
    <div class="search">
      <span class="rec"></span>
      <span class="ph">Search any song&hellip;</span>
      <span class="go" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"></circle><path d="m17 17-3.5-3.5"></path></svg>
      </span>
    </div>
    <div class="deck">
      <div class="fader"><i></i></div>
      <div class="platter"></div>
      <div class="arm"></div>
      <div class="play"></div>
      <div class="hint">drop a record here to start</div>
    </div>
    <div class="cue">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v12"></path><path d="m5 11 5 5 5-5"></path></svg>
      about
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
