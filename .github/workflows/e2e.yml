name: e2e

# Playwright device-matrix tests (client/tests). Serves a production build via
# `vite preview` (playwright.config.js webServer, CI branch) with every /api/*
# call mocked in client/tests/fixtures.js — no run touches Spotify, iTunes,
# Resend or Railway, and no secrets are needed. See client/tests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit

      # In CI, playwright.config.js's webServer builds the app and serves it with
      # `vite preview` on :5173. Every /api/* call is mocked in fixtures.js, so
      # no Express server / secrets are needed.
      - name: Run e2e suite
        working-directory: client
        run: npx playwright test
        env:
          CI: '1'

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14

      - name: Upload failure traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: client/test-results
          retention-days: 7
