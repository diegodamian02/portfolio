<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Diego Damian</title>
  <meta name="description" content="Software engineer building full-stack web apps. Rutgers CS with a Music Technology minor. Welcome to my playground." />
  <meta name="author" content="Diego Damian" />
  <link rel="canonical" href="https://diegodamian.com/" />

  <!-- Icons — the vinyl-record mark, replacing the old "D" wordmark
       (favicon.svg) sitewide. PNG, not SVG: the source art is a raster
       image, not something redrawn as vector paths, so a single
       reasonably-sized PNG (192×192) is the primary favicon; the 180×180
       copy is Apple's own documented size for iOS home-screen bookmarks,
       which don't accept the same icon. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Browser chrome follows the site's OWN theme, not the OS. The site is
       dark-first and OS-independent (navbar.jsx: localStorage "theme" || "dark"),
       so a prefers-color-scheme media query here would desync the mobile
       address/status bar from the in-page toggle. Dark is the default content;
       the inline script below and navbar.jsx rewrite it to the light
       --bg-color (#f3f0ea) whenever the visitor has chosen the light theme. -->
  <meta name="theme-color" content="#0a0e1a" />
  <script>
    /* Anti-FOUC: apply the stored theme before first paint. Without this a
       light-theme visitor gets a full-viewport dark flash on every load that
       does not play the once-per-session intro (return visits, reduced motion)
       — the token defaults on :root are the dark set and React only sets
       data-theme after it mounts. Only the attribute is set here: the built
       stylesheet is render-blocking, so the tokens resolve before paint.
       navbar.jsx reads the same localStorage value and its themeApplied ref
       stops this first application from crossfading. */
    (function () {
      /* Land at the top on every load. Without this the browser restores the
         previous scroll position on a reload/back-forward, dropping the visitor
         mid-hero (or lower) before Lenis initialises — reported as "the page
         starts in the wrong place." Deep links still work: useHashScroll
         (hooks/use-hash-scroll.js) scrolls to /#section after mount. */
      try {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      } catch (e) { /* no-op */ }
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#f3f0ea");
        }
      } catch (e) { /* private mode / storage disabled — stay on the dark default */ }
    })();
  </script>

  <!-- Open Graph / Facebook / LinkedIn / iMessage. og:image MUST be an
       absolute URL — crawlers do not resolve relative paths, which is the
       usual reason a preview silently renders blank. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Diego Damian" />
  <meta property="og:url" content="https://diegodamian.com/" />
  <meta property="og:title" content="Diego Damian — Software Engineer" />
  <meta property="og:description" content="Software engineer building full-stack web apps. Rutgers CS with a Music Technology minor. Welcome to my playground." />
  <meta property="og:image" content="https://diegodamian.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Diego Damian — Software Engineer. Welcome to my playground." />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Diego Damian — Software Engineer" />
  <meta name="twitter:description" content="Software engineer building full-stack web apps. Rutgers CS with a Music Technology minor. Welcome to my playground." />
  <meta name="twitter:image" content="https://diegodamian.com/og-image.png" />
  <meta name="twitter:image:alt" content="Diego Damian — Software Engineer. Welcome to my playground." />

  <!-- Helps search engines tie the domain to the person rather than treating
       it as a generic page — relevant for name searches. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Diego Damian",
    "url": "https://diegodamian.com/",
    "jobTitle": "Software Engineer",
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Rutgers University - New Brunswick"
    },
    "sameAs": [
      "https://github.com/diegodamian02",
      "https://www.linkedin.com/in/diegodamian02/"
    ]
  }
  </script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
